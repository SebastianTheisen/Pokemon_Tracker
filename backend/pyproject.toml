[project]
name = "pokemon-tracker-backend"
version = "0.1.0"
description = "Backend für den Pokémon-Karten-Tracker: Katalog, Preise, Sammlung, Scanner."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "structlog>=24.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
]
spike = [
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "rapidocr>=3.10.0",
]

[tool.uv]
# Spike-Werkzeuge (Scanner) gehören in Phase 0 zur Standardinstallation.
default-groups = ["dev", "spike"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "C4", "SIM", "RUF", "PTH", "TID", "PL",
]
ignore = ["PLR0913"]
# Deutsche Texte nutzen bewusst Gedankenstriche.
allowed-confusables = ["–", "×", "−"]

[tool.ruff.lint.isort]
# Der Ordner alembic/ (Migrationen) ist nicht das Paket „alembic“.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Tests: assert, Zahlen-Literale und Test-Geheimnisse sind gewollt.
"tests/**" = ["S101", "PLR2004", "S105", "S106", "PLR0917"]
"scripts/**" = ["T201", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "scripts"]

[[tool.mypy.overrides]]
# Ohne Typ-Stubs; wird über eine typisierte Hülle (scripts/spike_scanner.Ocr) genutzt.
module = ["pillow_heif", "asyncpg"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
# SQLAlchemy async arbeitet mit greenlets – sonst fehlen Zeilen nach DB-Aufrufen.
concurrency = ["greenlet", "thread"]
source = ["app"]
branch = true
