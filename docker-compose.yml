# Lokale Entwicklung und Basis für den VPS.
# Tailscale läuft als eigenes Gerät „kartenkiste“ im Container (Plan 8.1) – getrennt von
# einem Tailscale, das evtl. schon direkt auf dem VPS für andere Apps läuft.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracker}
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      PT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:-tracker}@db:5432/${POSTGRES_DB:-tracker}
      PT_WEB_DIR: /srv/web
    volumes:
      - scanner-data:/data/scanner
      - ./app/build/web:/srv/web:ro  # Flutter-Web-Build (PWA), gebaut von app-builder
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      PT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:-tracker}@db:5432/${POSTGRES_DB:-tracker}
    volumes:
      - scanner-data:/data/scanner  # Aufräumen verwaister Referenzbilder
    depends_on:
      api:
        condition: service_healthy  # API führt beim Start die Migrationen aus
    healthcheck:
      disable: true
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:stable
    hostname: kartenkiste
    environment:
      TS_HOSTNAME: kartenkiste
      # Optional: Auth-Key aus dem Tailscale-Admin. Ohne Key steht beim ersten Start ein
      # Login-Link im Log (deploy/phase5_tailscale.sh zeigt ihn an).
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"  # kein /dev/net/tun und keine Extra-Rechte nötig
      TS_SERVE_CONFIG: /config/serve.json  # HTTPS (*.ts.net) → api:8000
      # Eigener UDP-Port für direkte Verbindungen (sonst nur Umweg über Tailscale-Relays, der
      # bei großen Dateien abbrach). 41641 gehört dem Tailscale direkt auf dem VPS.
      TS_TAILSCALED_EXTRA_ARGS: --port=${TS_PORT:-41642}
    ports:
      - "${TS_PORT:-41642}:${TS_PORT:-41642}/udp"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./deploy/tailscale/serve.json:/config/serve.json:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Tägliche Sicherung von Datenbank und Scanner-Daten nach ./backups (Plan Phase 6)
  backup:
    image: postgres:16-alpine
    entrypoint: ["sh", "/backup.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
      PGPASSWORD: ${POSTGRES_PASSWORD:-tracker}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - scanner-data:/data/scanner:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Überwachung mit Push-Nachricht (ntfy), unabhängig vom Worker (Plan Phase 6)
  monitor:
    build: ./backend
    command: ["python", "-m", "app.monitor"]
    env_file: .env
    environment:
      PT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:-tracker}@db:5432/${POSTGRES_DB:-tracker}
      PT_MONITOR_API_URL: http://api:8000/api/v1/health
      PT_MONITOR_BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups:ro
      - scanner-data:/data/scanner:ro  # Herzschlag des Workers
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  # Nur zum Bauen der App: docker compose --profile build run --rm app-builder ...
  app-builder:
    build: ./deploy/app-builder
    profiles: ["build"]
    volumes:
      - ./app:/work
      - app-builder-cache:/cache          # pub- und Gradle-Cache (schnellere Builds)
      - app-builder-android:/root/.android  # Signaturschlüssel: gleich bleibend → Updates installierbar

volumes:
  db-data:
  scanner-data:
  tailscale-state:
  app-builder-cache:
  app-builder-android:
